[system]
ffmpeg_threads = 1

[filter]
# Very light denoise + deband to let you raise CRF by ~1–2 with minimal visual cost
prefilter_on = true

[sampling]
sample_sec = 6.0

[vmaf]
# Fast VMAF everywhere for speed; set subsample=1 for full VMAF (slower)
subsample = 5
threads   = 1

[metric]
# S = w1*(1 - C^1.5) + w2*((VMAF - 80)/20)
w1 = 0.7
w2 = 0.3

[policy]
target_vmaf = 80.0
target_c_max = 0.60

[svtav1]
# CRF ladder for AV1 (MP4/MKV). Lower CRF = higher quality/bigger size.
crf_ladder   = 34, 36, 32, 38, 30
preset_sample = 6
preset_final  = 5
# Extra encoder params
svt_params = enable-qm=1:input-depth=10:enable-cdef=1:enable-restoration=1

[x265]
# CRF ladder for HEVC (MOV). Lower CRF = higher quality/bigger size.
crf_ladder   = 32, 34, 30, 28, 26
preset_sample = medium
preset_final  = slow
x265_params = rd=5:rc-lookahead=40:qcomp=0.70:aq-mode=2:aq-strength=1.1:psy-rd=1.0:psy-rdoq=1.0:b-intra=1:bframes=8:sao=0:deblock=-1:-1:cutree=1

[x264]
# CRF ladder for H.264 (AVI). Lower CRF = higher quality/bigger size.
crf_ladder   = 22, 24, 26, 28, 20
preset_sample = medium
preset_final  = slow
x264_params = rc-lookahead=40:qcomp=0.70:aq-mode=2:aq-strength=1.0:psy-rd=0.8:deblock=-1:-1:ref=6:bframes=6:b-adapt=2